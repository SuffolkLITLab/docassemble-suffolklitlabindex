[build-system]
requires = [
    "setuptools>=80.9.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "docassemble.suffolklitlabindex"
version = "1.0.0"
description = "An index page with terms of use for the LIT Lab's docassemble development server"
readme = "README.md"
authors = [
    { name = "Quinten Steenhuis", email = "qsteenhuis@suffolk.edu" },
]
dependencies = [
    "docassemble.ALToolbox @ git+https://github.com/SuffolkLITLab/docassemble-ALToolbox.git@main",
]
license = "MIT"
license-files = [
    "LICENSE",
]

[project.urls]
Homepage = "https://assemblyline.suffolklitlab.org/"

[tool.setuptools.packages.find]
where = [
    ".",
]
